---
name: Statistics Manager Tests

on:
  pull_request:
    paths:
      - apps/statistics_manager/**
      - tests/test_statistics_manager.py
      - tests/test_statistics_api.py
      - .github/workflows/statistics-tests.yml
  push:
    branches:
      - main
    paths:
      - apps/statistics_manager/**
      - tests/test_statistics_manager.py
      - tests/test_statistics_api.py
      - .github/workflows/statistics-tests.yml

permissions:
  contents: read

jobs:
  test:
    runs-on:
      - self-hosted
      - linux
      - x64
      - cc
      - iac
      - opentofu
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: '3.15'
      - name: Test native helper lifecycle and flows
        env:
          PYTHONPATH: apps
        run: uv run --no-project --python 3.15 python -m unittest discover -s tests -p 'test_statistics_*.py' -v
